[project]
name = "trainer"
version = "0.1.0"
description = "Korean vocab trainer: flashcard and typing drills from markdown decks"
requires-python = ">=3.12"
dependencies = ["nicegui>=2.0"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
main_file = ""
asyncio_default_fixture_loop_scope = "function"
